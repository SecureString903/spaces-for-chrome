<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spaces</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <header class="app-header">
    <div class="app-title">
      <img src="../icons/icon32.png" alt="" width="20" height="20" />
      <h1>Spaces</h1>
    </div>
    <div class="header-right">
      <div id="current-chip" class="current-chip" hidden></div>
      <button id="options-btn" class="icon-btn always-visible" title="Options">⚙</button>
    </div>
  </header>

  <div id="banner" class="banner" hidden></div>

  <main>
    <section class="section">
      <div class="section-head">
        <h2>Your Spaces</h2>
      </div>
      <ul id="space-list" class="space-list"></ul>
      <div id="editor-slot"></div>
      <button id="new-space-btn" class="ghost-btn">＋ New Space</button>
    </section>

    <section class="section" id="bookmarks-section" hidden>
      <div class="section-head">
        <h2>Bookmarks</h2>
        <span id="bm-note" class="muted"></span>
      </div>
      <div class="bm-controls">
        <select id="bm-folder-select" class="bm-select" title="Choose which folder to show"></select>
        <button id="bm-pin-btn" class="icon-btn always-visible" title="Show this folder by default for the current Space">📌</button>
        <button id="bm-add-btn" class="icon-btn always-visible" title="Bookmark the current tab into this folder">★</button>
      </div>
      <ul id="bm-list" class="tab-list"></ul>
    </section>

    <section class="section">
      <div class="section-head">
        <h2>Tabs in this window</h2>
        <span id="tab-count" class="muted"></span>
      </div>
      <ul id="tab-list" class="tab-list"></ul>
    </section>

    <section class="section" id="backups-section" hidden>
      <div class="section-head">
        <h2>Backups</h2>
        <span id="backup-count" class="muted"></span>
      </div>
      <p class="empty-note">Tab lists saved automatically before switches and deletions.</p>
      <ul id="backup-list" class="backup-list"></ul>
    </section>
  </main>

  <dialog id="confirm-dialog" class="confirm-dialog">
    <p id="confirm-text"></p>
    <div class="dialog-actions">
      <button id="confirm-cancel" class="ghost-btn">Cancel</button>
      <button id="confirm-ok" class="primary-btn">Confirm</button>
    </div>
  </dialog>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
